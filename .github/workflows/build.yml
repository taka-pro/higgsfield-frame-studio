name: Build and package Windows app
on:
  push:
    paths: ['src/**', 'tests/**', 'scripts/**', 'ref/**', 'README.md', 'LICENSE', 'SAMPLE-ASSETS.md', 'global.json', '.github/workflows/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test and build
        shell: pwsh
        run: |
          dotnet run --project tests/HiggsfieldStudio.Tests -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build src/HiggsfieldStudio/HiggsfieldStudio.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package for download
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: ./scripts/Build-Release.ps1
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: FrameStudio-win-x64
          path: |
            dist/releases/FrameStudio-win-x64.zip
            dist/releases/FrameStudio-win-x64.zip.sha256
          if-no-files-found: error
